# Mesquite simulator: default parameters.
# Every parameter: value, label (datasheet | firmware | assumption | measured), source; optional sweep.
# Units are in the names. Ranges written [a, b] are uniform draws per pod unless the source says otherwise.
# Every "assumption" will be replaced by Danyal's bench measurements (brief §4.3).

motion:
  spine_joint:
    value: 9
    label: assumption
    source: "brief §5.1: the chest pod follows SMPL spine3 (9); spine2 (6) is the documented alternative; Danyal decides"

session:
  boot_spread_s:
    value: 0.5
    label: assumption
    source: "brief §3.5: pods switched on together in the box; boot moments spread uniformly over this window"
  box_s:
    value: 5.0
    label: assumption
    source: "brief §3.5: 'a few seconds of frames' in the box, counted from the first power-on"
  strapping_s:
    value: 30.0
    label: assumption
    source: "time to take the pods out and strap them on; unmeasured"
  strap_move_s:
    value: [2.0, 6.0]
    label: assumption
    source: "each pod's own carry-and-strap movement lasts this long, inside the strapping phase"
  strap_spins_max:
    value: 1
    label: assumption
    source: "whole turns about the vertical while a pod is carried: integer in [-max, max]"
  tpose_s:
    value: 3.0
    label: assumption
    source: "brief §3.5: T-pose calibration snapshot; duration unmeasured"
  idle_s:
    value: 0.0
    label: assumption
    source: "brief §4.3: idle interval of 0-30 min between T-pose and motion makes drift visible; not recorded"
    sweep: [0.0, 600.0, 1800.0]
  tpose_posture_deg:
    value: 5.0
    label: assumption
    source: "brief §4.3: T-pose posture error about 5 deg per segment (RMS rotation angle)"
  facing_error_deg:
    value: 15.0
    label: assumption
    source: "brief §4.3: motion starts facing the T-pose direction within +-15 deg (uniform)"
  mounting_max_deg:
    value: 20.0
    label: assumption
    source: "brief §4.3: pod mounting within +-20 deg per axis of its nominal placement (uniform)"

timing:
  chip_rate_hz:
    value: [50.1, 60.0]
    label: datasheet
    source: "brief §3.3: 1.1 kHz / (1 + 19) nominal 55 Hz; clock tolerance gives 50.1-60.0 Hz per part"
  chip_start_s:
    value: [0.2, 0.5]
    label: assumption
    source: "delay from pod boot to the chip's first fused sample; unmeasured"
  decode_delay_ms:
    value: [0.0, 11.0]
    label: assumption
    source: "brief §3.3: ms_lo is the decode time, 0-11 ms after the sample (firmware polling)"
  send_period_us:
    value: 31250
    label: firmware
    source: "brief §3.3: fixed 32 Hz send grid on the pod clock"
  send_phase_divisor:
    value: 17
    label: firmware
    source: "brief §3.3: send phase after boot is id x 31250 / 17 us"
  grid_start_ms:
    value: 1000.0
    label: assumption
    source: "pod milliseconds from boot to the first send (firmware start-up); unmeasured"
  stall_ms:
    value: 0.0
    label: assumption
    source: "brief §3.3, §4.3: optional sample-task stall of S ms every ~3 s, off by default; unmeasured"
    sweep: [0.0, 50.0, 100.0, 200.0]
  stall_period_s:
    value: 3.0
    label: assumption
    source: "brief §4.3: one stall every 3 s of pod time"
  stall_jitter_s:
    value: 0.5
    label: assumption
    source: "each stall starts within +-jitter of its 3 s mark (uniform), so its phase on the send grid varies"
  decode_busy_ms:
    value: 1.0
    label: assumption
    source: "after a stall the decode task needs this long before the next decode; keeps ms_lo distinct per sample"
  pod_clock_ppm:
    value: 50.0
    label: assumption
    source: "pod millisecond clock rate error, uniform within +-ppm (crystal); unmeasured"
  host_epoch_s:
    value: [100.0, 1000.0]
    label: assumption
    source: "arbitrary origin of the logger's host clock, so nothing can rely on host time = true time"

radio:
  loss_mean:
    value: 0.02
    label: assumption
    source: "brief §4.3: two-state (Gilbert-Elliott) radio loss, stationary loss fraction; unmeasured"
    sweep: [0.005, 0.02, 0.05]
  burst_mean_frames:
    value: 3.0
    label: assumption
    source: "brief §4.3: mean length of a run of lost frames; unmeasured"
    sweep: [1.0, 3.0, 10.0]
  latency_min_ms:
    value: 2.0
    label: assumption
    source: "shortest send-to-host delay through radio, hub and USB; unmeasured"
  latency_jitter_ms:
    value: 3.0
    label: assumption
    source: "mean of the exponential extra delay on top of latency_min_ms; unmeasured"

error_model:
  offset_mode:
    value: arbitrary
    label: assumption
    source: "brief §4.3: 'aligned' (north from the chip's own heading at start-up) or 'arbitrary' (uniform); 'none' only for checks"
    sweep: [aligned, arbitrary]
  box_slot_deg:
    value: 2.0
    label: assumption
    source: "brief §4.3: heading error of each pod's slot in the box (normal, sigma)"
    sweep: [0.5, 2.0, 5.0]
  drift_sigma_deg_per_min:
    value: 0.2
    label: assumption
    source: "brief §4.3: residual gyro-bias drift b_i ~ N(0, sigma); undocumented by TDK; swept"
    sweep: [0.05, 0.2, 1.0]
  scale_factor_max:
    value: 0.015
    label: datasheet
    source: "brief §4.3 citing ICM-20948 DS-000189 rev 1.3 (Tables 1 and 5): scale factor within +-1.5 % at 25 C, 3 % for stress; k_i uniform in +-max"
    sweep: [0.015, 0.03]
  arw_deg_per_sqrt_s:
    value: 0.015
    label: datasheet
    source: "brief §4.3 citing ICM-20948 DS-000189 rev 1.3 (Tables 1 and 5): noise density 0.015 deg/s/sqrt(Hz); sigma(t) = N_g sqrt(t)"
  tilt_sigma_deg:
    value: 0.5
    label: assumption
    source: "brief §4.3: fusion tilt-and-noise error eta about 0.5 deg per axis (Gauss-Markov, body frame)"
  tilt_tau_s:
    value: 1.0
    label: assumption
    source: "correlation time of eta; unmeasured"
  reboot_rate_per_h:
    value: 0.0
    label: assumption
    source: "brief §4.3: default none; stress setting 1 per pod per hour (Poisson)"
    sweep: [0.0, 1.0]
  reboot_silence_s:
    value: 3.0
    label: assumption
    source: "brief §3.3: a rebooting pod is silent for a few seconds"
  idle_turns_sigma_per_sqrt_min:
    value: 0.5
    label: assumption
    source: "brief §4.3: 'an assumed amount of turning' in the idle interval: whole turns ~ round(N(0, (s sqrt(min))^2))"

battery:
  start_pct:
    value: [70.0, 100.0]
    label: assumption
    source: "charge at power-on; cosmetic"
  drain_pct_per_h:
    value: 10.0
    label: assumption
    source: "battery drain; cosmetic"

dataset:
  window_s:
    value: 20.0
    label: assumption
    source: "experiment design: each sequence is cut into non-overlapping windows of this length; shorter tails are dropped"
  windows_per_sequence:
    value: 3
    label: assumption
    source: "experiment design: at most this many windows from the start of each sequence"
  motion_start_min:
    value: [1, 10, 30]
    label: assumption
    source: "brief §4.7: report at 1, 10 and 30 min since boot; one session per window and value (idle = 60 m - box - strapping - T-pose)"
  variants:
    value: 1
    label: assumption
    source: "experiment design: independent corruption draws (seeds) per window and motion start; all stay in the sequence's split"

eval:
  grid_hz:
    value: 32.0
    label: firmware
    source: "brief §4.7: errors are reported per 32 Hz step, the send rate"
