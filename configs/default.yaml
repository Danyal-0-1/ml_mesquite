# Mesquite simulator and Step 2 estimator: default parameters.
# Every parameter: value, label (datasheet | firmware | assumption | measured | fitted), source; optional sweep.
# Units are in the names. Ranges written [a, b] are uniform draws per pod unless the source says otherwise.
# Every "assumption" will be replaced by Danyal's bench measurements (brief §4.3).
# "fitted": estimated on the training or validation split by the command named in its source; never on test data.
# The geometry: section holds the estimator's own beliefs; the estimator never reads error_model: (the truth).

motion:
  spine_joint:
    value: 9
    label: assumption
    source: "brief §5.1: the chest pod follows SMPL spine3 (9); spine2 (6) is the documented alternative; Danyal decides"

session:
  boot_spread_s:
    value: 0.5
    label: assumption
    source: "brief §3.5: pods switched on together in the box; boot moments spread uniformly over this window"
  box_s:
    value: 5.0
    label: assumption
    source: "brief §3.5: 'a few seconds of frames' in the box, counted from the first power-on"
  strapping_s:
    value: 30.0
    label: assumption
    source: "time to take the pods out and strap them on; unmeasured"
  strap_move_s:
    value: [2.0, 6.0]
    label: assumption
    source: "each pod's own carry-and-strap movement lasts this long, inside the strapping phase"
  strap_spins_max:
    value: 1
    label: assumption
    source: "whole turns about the vertical while a pod is carried: integer in [-max, max]"
  tpose_s:
    value: 3.0
    label: assumption
    source: "brief §3.5: T-pose calibration snapshot; duration unmeasured"
  idle_s:
    value: 0.0
    label: assumption
    source: "brief §4.3: idle interval of 0-30 min between T-pose and motion makes drift visible; not recorded"
    sweep: [0.0, 600.0, 1800.0]
  tpose_posture_deg:
    value: 5.0
    label: assumption
    source: "brief §4.3: T-pose posture error about 5 deg per segment (RMS rotation angle)"
  facing_error_deg:
    value: 15.0
    label: assumption
    source: "brief §4.3: motion starts facing the T-pose direction within +-15 deg (uniform)"
  mounting_max_deg:
    value: 20.0
    label: assumption
    source: "brief §4.3: pod mounting within +-20 deg per axis of its nominal placement (uniform)"

timing:
  chip_rate_hz:
    value: [50.1, 60.0]
    label: datasheet
    source: "brief §3.3: 1.1 kHz / (1 + 19) nominal 55 Hz; clock tolerance gives 50.1-60.0 Hz per part"
  chip_start_s:
    value: [0.2, 0.5]
    label: assumption
    source: "delay from pod boot to the chip's first fused sample; unmeasured"
  decode_delay_ms:
    value: [0.0, 11.0]
    label: assumption
    source: "brief §3.3: ms_lo is the decode time, 0-11 ms after the sample (firmware polling)"
  send_period_us:
    value: 31250
    label: firmware
    source: "brief §3.3: fixed 32 Hz send grid on the pod clock"
  send_phase_divisor:
    value: 17
    label: firmware
    source: "brief §3.3: send phase after boot is id x 31250 / 17 us"
  grid_start_ms:
    value: 1000.0
    label: assumption
    source: "pod milliseconds from boot to the first send (firmware start-up); unmeasured"
  stall_ms:
    value: 0.0
    label: assumption
    source: "brief §3.3, §4.3: optional sample-task stall of S ms every ~3 s, off by default; unmeasured"
    sweep: [0.0, 50.0, 100.0, 200.0]
  stall_period_s:
    value: 3.0
    label: assumption
    source: "brief §4.3: one stall every 3 s of pod time"
  stall_jitter_s:
    value: 0.5
    label: assumption
    source: "each stall starts within +-jitter of its 3 s mark (uniform), so its phase on the send grid varies"
  decode_busy_ms:
    value: 1.0
    label: assumption
    source: "after a stall the decode task needs this long before the next decode; keeps ms_lo distinct per sample"
  pod_clock_ppm:
    value: 50.0
    label: assumption
    source: "pod millisecond clock rate error, uniform within +-ppm (crystal); unmeasured"
  host_epoch_s:
    value: [100.0, 1000.0]
    label: assumption
    source: "arbitrary origin of the logger's host clock, so nothing can rely on host time = true time"

radio:
  loss_mean:
    value: 0.02
    label: assumption
    source: "brief §4.3: two-state (Gilbert-Elliott) radio loss, stationary loss fraction; unmeasured"
    sweep: [0.005, 0.02, 0.05]
  burst_mean_frames:
    value: 3.0
    label: assumption
    source: "brief §4.3: mean length of a run of lost frames; unmeasured"
    sweep: [1.0, 3.0, 10.0]
  latency_min_ms:
    value: 2.0
    label: assumption
    source: "shortest send-to-host delay through radio, hub and USB; unmeasured"
  latency_jitter_ms:
    value: 3.0
    label: assumption
    source: "mean of the exponential extra delay on top of latency_min_ms; unmeasured"

error_model:
  offset_mode:
    value: arbitrary
    label: assumption
    source: "brief §4.3: 'aligned' (north from the chip's own heading at start-up) or 'arbitrary' (uniform); 'none' only for checks"
    sweep: [aligned, arbitrary]
  box_slot_deg:
    value: 2.0
    label: assumption
    source: "brief §4.3: heading error of each pod's slot in the box (normal, sigma)"
    sweep: [0.5, 2.0, 5.0]
  drift_sigma_deg_per_min:
    value: 0.2
    label: assumption
    source: "brief §4.3: residual gyro-bias drift b_i ~ N(0, sigma); undocumented by TDK; swept. Stress value 2.0: Step 2 brief §4.1, the 2026-11-04 static hold of the real suit (JSON path), where the Head pod drifted -2.0 deg/min for 7 min (one pod's early drift, not a measured spread)"
    sweep: [0.05, 0.2, 1.0, 2.0]
  scale_factor_max:
    value: 0.015
    label: datasheet
    source: "brief §4.3 citing ICM-20948 DS-000189 rev 1.3 (Tables 1 and 5): scale factor within +-1.5 % at 25 C, 3 % for stress; k_i uniform in +-max"
    sweep: [0.015, 0.03]
  arw_deg_per_sqrt_s:
    value: 0.015
    label: datasheet
    source: "brief §4.3 citing ICM-20948 DS-000189 rev 1.3 (Tables 1 and 5): noise density 0.015 deg/s/sqrt(Hz); sigma(t) = N_g sqrt(t)"
  tilt_sigma_deg:
    value: 0.5
    label: assumption
    source: "brief §4.3: fusion tilt-and-noise error eta about 0.5 deg per axis (Gauss-Markov, body frame)"
  tilt_tau_s:
    value: 1.0
    label: assumption
    source: "correlation time of eta; unmeasured"
  reboot_rate_per_h:
    value: 0.0
    label: assumption
    source: "brief §4.3: default none; stress setting 1 per pod per hour (Poisson)"
    sweep: [0.0, 1.0]
  reboot_silence_s:
    value: 3.0
    label: assumption
    source: "brief §3.3: a rebooting pod is silent for a few seconds"
  idle_turns_sigma_per_sqrt_min:
    value: 0.5
    label: assumption
    source: "brief §4.3: 'an assumed amount of turning' in the idle interval: whole turns ~ round(N(0, (s sqrt(min))^2))"

battery:
  start_pct:
    value: [70.0, 100.0]
    label: assumption
    source: "charge at power-on; cosmetic"
  drain_pct_per_h:
    value: 10.0
    label: assumption
    source: "battery drain; cosmetic"

dataset:
  window_s:
    value: 20.0
    label: assumption
    source: "experiment design: each sequence is cut into non-overlapping windows of this length; shorter tails are dropped"
  windows_per_sequence:
    value: 3
    label: assumption
    source: "experiment design: at most this many windows from the start of each sequence"
  motion_start_min:
    value: [1, 10, 30]
    label: assumption
    source: "brief §4.7: report at 1, 10 and 30 min since boot; one session per window and value (idle = 60 m - box - strapping - T-pose)"
  variants:
    value: 1
    label: assumption
    source: "experiment design: independent corruption draws (seeds) per window and motion start; all stay in the sequence's split"

eval:
  grid_hz:
    value: 32.0
    label: firmware
    source: "brief §4.7: errors are reported per 32 Hz step, the send rate"

# ---------------------------------------------------------------- Step 2: the geometric estimator (GEO-K, GEO-ID)
# The estimator's own beliefs (Step 2 brief rule 8). Sweeps change only the simulator, never these.
geometry:
  window_s:
    value: 8.0
    label: assumption
    source: "Step 2 brief §5.7, after Lehmann et al. 2020 (IFAC-PapersOnLine 53(2), doi:10.1016/j.ifacol.2020.12.401): each joint is re-solved over the last 8 s; ablations 4 and 16 s"
    sweep: [4.0, 8.0, 16.0]
  step_s:
    value: 1.0
    label: assumption
    source: "Step 2 brief §5.7, after Lehmann et al. 2020: re-solve every 1 s. Consecutive windows share (window - step)/window of their samples, so each window enters the filter with weight step_s/window_s"
  max_pair_gap_s:
    value: 0.1
    label: assumption
    source: "Step 2 brief §5.3: a child is slerped between two fresh samples at most this far apart (about 3 send periods); otherwise no pair"
  clock_window_s:
    value: 30.0
    label: assumption
    source: "Step 2 brief §5.3: the causal pod-to-host clock map is fitted on the last 30 s of a pod's frames of its current boot epoch (a +-50 ppm clock moves 1.5 ms in 30 s)"
  clock_block_s:
    value: 2.0
    label: assumption
    source: "Step 2 brief §5.3: lower envelope of host minus pod time = the minimum per block of 2 pod seconds (64 sends), then a line through the block minima"
  box_sigma_deg:
    value: 2.0
    label: assumption
    source: "Step 2 brief §5.7: the estimator's belief about each pod's box-slot heading error; kappa0 = 1/sigma_pair^2 with sigma_pair = sqrt(2)·box_sigma. Not read from error_model.box_slot_deg (the simulator's truth)"
  drift_q_rad2_per_s:
    value: 5.623e-05
    label: fitted
    source: "fitted by `python -m mesqsim fit-geometry calibration --source amass --seed 1 --write` on AMASS (split manifest SHA-256 d36448adb767), validation split only: 330 sessions of 78 sequences, 9 subjects, GEO-ID; commit 944b822e3031, 2026-11-17: the log-grid value with the largest von Mises log-likelihood of the filter's outputs at every motion-phase 32 Hz step"
  hold_target_p95_deg:
    value: 10.0
    label: assumption
    source: "Step 2 brief §5.7 hold rule: kappa_hold is fitted on validation as the smallest threshold whose retained steps (kappa >= it) have a 95th-percentile error of at most 10 deg"
  kappa_hold:
    value: 89.1251
    label: fitted
    source: "fitted by `python -m mesqsim fit-geometry calibration --source amass --seed 1 --write` on AMASS (split manifest SHA-256 d36448adb767), validation split only: 330 sessions of 78 sequences, 9 subjects, GEO-ID; commit 944b822e3031, 2026-11-17: the smallest threshold whose retained steps have P95 error <= 10 deg"
  kappa_scale:
    hinge:
      value: 60.148753
      label: fitted
      source: "fitted by `python -m mesqsim fit-geometry calibration --source amass --seed 1 --write` on AMASS (split manifest SHA-256 d36448adb767), validation split only: 330 sessions of 78 sequences, 9 subjects, GEO-ID; commit 944b822e3031, 2026-11-17: maximum likelihood of the window errors under VM(0, s·k/(1 + k·sigma_m^2))"
    2dof:
      value: 0.752188
      label: fitted
      source: "fitted by `python -m mesqsim fit-geometry calibration --source amass --seed 1 --write` on AMASS (split manifest SHA-256 d36448adb767), validation split only: 330 sessions of 78 sequences, 9 subjects, GEO-ID; commit 944b822e3031, 2026-11-17: maximum likelihood of the window errors under VM(0, s·k/(1 + k·sigma_m^2))"
    3dof:
      value: 4.576599
      label: fitted
      source: "fitted by `python -m mesqsim fit-geometry calibration --source amass --seed 1 --write` on AMASS (split manifest SHA-256 d36448adb767), validation split only: 330 sessions of 78 sequences, 9 subjects, GEO-ID; commit 944b822e3031, 2026-11-17: maximum likelihood of the window errors under VM(0, s·k/(1 + k·sigma_m^2))"
  model_sigma_deg:
    hinge:
      value: 66.0414
      label: fitted
      source: "fitted by `python -m mesqsim fit-geometry calibration --source amass --seed 1 --write` on AMASS (split manifest SHA-256 d36448adb767), validation split only: 330 sessions of 78 sequences, 9 subjects, GEO-ID; commit 944b822e3031, 2026-11-17: maximum likelihood, jointly with kappa_scale.hinge"
    2dof:
      value: 3.0
      label: assumption
      source: "how far a real elbow, wrist or ankle departs from a 2-DoF joint within one window (window variance += this^2); Step 2 brief §5.5 asks to measure the third-axis rotation on AMASS train"
    3dof:
      value: 20.8514
      label: fitted
      source: "fitted by `python -m mesqsim fit-geometry calibration --source amass --seed 1 --write` on AMASS (split manifest SHA-256 d36448adb767), validation split only: 330 sessions of 78 sequences, 9 subjects, GEO-ID; commit 944b822e3031, 2026-11-17: maximum likelihood, jointly with kappa_scale.3dof"
  hinge_sigma_floor_deg:
    value: 0.5
    label: assumption
    source: "Step 2 brief §5.4: floor of the hinge residual spread sigma_hat in kappa = I/sigma_hat^2 (noise-free data would give kappa = infinity); the estimator's belief about fusion tilt error"
  axis_span_s:
    value: 120.0
    label: assumption
    source: "Step 2 brief §5.4 (GEO-ID): hinge axes are identified from the rate pairs of the last 120 s (current boot epochs, from the T-pose on); axes are fixed in the pods, so a long span helps"
  axis_min_rate_deg_s:
    value: 20.0
    label: assumption
    source: "Step 2 brief §5.4: only rate pairs with |omega_p| + |omega_c| >= 20 deg/s ('enough rotation') enter the axis fit"
  axis_min_pairs:
    value: 64
    label: assumption
    source: "Step 2 brief §5.4: at least 64 such rate pairs (2 s of motion at 32 Hz) before an axis fit is attempted"
  axis_max_residual:
    value: 0.5
    label: assumption
    source: "Step 2 brief §5.4: an axis fit is accepted when the RMS of |w_p x u_p| - |w_c x u_c| is at most 0.5 x the RMS rate (0 for an exact hinge)"
  axis_contrast_max:
    value: 0.25
    label: assumption
    source: "Step 2 brief §5.4 identifiability: an axis fit is accepted only if its cost is at most 0.25 x the median cost over alternative axes; when thigh and shin turn together (no knee motion) every axis fits"
  axis_tpose_tolerance_deg:
    value: 15.0
    label: assumption
    source: "GEO-ID ties the knee axis to the T-pose (horizontal there, one line in both segments; one unknown), then refines all four angles locally and keeps the refinement only within 15 deg of the tied solution (the T-pose posture error is about 5 deg per segment)"
  axis_starts:
    value: 8
    label: assumption
    source: "Step 2 brief §5.4: least squares from 8 fixed starts for the first fit (several starts); later fits warm-start from the previous one plus 2"
  sign_min_elev_deg:
    value: 5.0
    label: assumption
    source: "Step 2 brief §5.4 sign rule: sum (q_p u_p)_z (q_c u_c)_z votes only when the mean product is at least sin^2(5 deg) (the axis tilted at least 5 deg RMS from horizontal)"
  tpose_sign_margin_deg:
    value: 60.0
    label: assumption
    source: "Step 2 brief §5.4 Should (knee one-way flexion), realised as a T-pose rule: under the flipped sign the knee would be turned 180 deg since the T-pose; vote when the median angles differ by at least 60 deg"
  facing_flex_min_deg:
    value: 20.0
    label: assumption
    source: "GEO-ID facing from the knees (substitute for Step 2 brief §5.8): samples whose shin has turned at least 20 deg since the T-pose vote on which way the knee axis points (the knee flexes one way)"
  twodof_sigma_floor_deg:
    value: 0.5
    label: assumption
    source: "Step 2 brief §5.5: floor of the 2-DoF residual spread, as the dot-product error sin(0.5 deg) of a 0.5 deg axis error"
  twodof_ambiguity_llr:
    value: 3.0
    label: assumption
    source: "Step 2 brief §5.5 two-minima rule: ambiguous (kappa = 0) when the second minimum is less likely than the best by a factor below e^3 = 20, i.e. its cost exceeds the best by less than 2·sigma_hat^2·3"
  rom_sigma_deg:
    value: 5.0
    label: assumption
    source: "Step 2 brief §5.6: spread of a joint angle about its true value (fusion, T-pose and mounting errors) in the range-of-motion weights exp(-cost/(2 sigma^2))"
  rom_percentiles:
    value: [0.5, 99.5]
    label: assumption
    source: "Step 2 brief §5.6: Omega = the 0.5th and 99.5th percentiles of the training subjects' true joint angles"
  rom_limits_deg:
    lower_back:
      value: [[-15.44, 69.2], [-22.9, 25.83], [-29.46, 24.47]]
      label: fitted
      source: "fitted by `python -m mesqsim fit-geometry rom --source amass --write` on AMASS (split manifest SHA-256 d36448adb767), training split only: the 0.5th and 99.5th percentiles of the true Cardan angles (XZY) over 1,919,013 frames of 5,974 sequences (subsampled to about 30 Hz); commit 894ba791b452, 2026-11-16"
    neck:
