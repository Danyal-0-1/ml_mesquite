[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesqsim"
version = "3.0.0"
description = "Mesquite ML: suit simulator and baselines (Step 1), geometric estimator GEO (Step 2), Mesquite twin and model kit (Step 3)"
requires-python = ">=3.11,<3.12"
# Exact versions are pinned in requirements.txt (and requirements-lock.txt).
dependencies = []

[tool.setuptools.packages.find]
include = ["mesqsim*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/brief"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "amass: needs the licensed AMASS data and SMPL+H model (skips when absent)",
    "diodem: needs the DIODEM download (skips when absent)",
    "real: needs Danyal's recordings in $MESQ_DATA_DIR/real_suit (skips when absent)",
    "node: needs Node.js for the page golden test (skips when absent; fixtures cover the Python side)",
    "swift: needs a Swift toolchain for the phone app's golden test (skips when absent; a fixture covers the port)",
    "slow: Monte Carlo or end-to-end checks that take more than a few seconds",
]
